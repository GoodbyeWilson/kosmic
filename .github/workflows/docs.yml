# Build the documentation site and publish it to GitHub Pages.
#
# The site is MkDocs over the same Markdown the app shows on F1
# (kosmic/gui/help/content), so a docs change is a normal commit to the
# repo and goes live on merge. Pull requests only build, to catch broken
# links and nav entries before they land.
#
# One-time setup on the repository: Settings -> Pages -> Source: GitHub
# Actions. To serve it from the project domain, add the domain under
# Settings -> Pages -> Custom domain and a CNAME record at the DNS host
# pointing at <owner>.github.io.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'kosmic/**'
      - 'dev/docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'kosmic/**'
      - 'dev/docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The reference pages are generated from the package, so the docs
      # build needs the package importable (deps included: mkdocstrings
      # reads signatures statically, but the gen script imports nothing
      # heavier than the tree). pyproject.toml pins the doc tooling.
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
