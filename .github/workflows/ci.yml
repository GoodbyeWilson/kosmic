# Lint + test on every push and pull request.
#
# KOSMIC is a Qt desktop app, so the suite needs a display. It runs
# headless via QT_QPA_PLATFORM=offscreen, which the GUI tests already
# set themselves; it is repeated here so a test that forgets to still
# works in CI. Linux additionally needs the xkb/EGL libraries that
# PyQt6 links against, which the GitHub runner image does not carry by
# default.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PyQt6 links these at import time; without them every GUI test
      # fails with a missing-plugin error rather than a real failure.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check kosmic/ main.py tests/

      - name: Test
        run: pytest tests/ -q

  # No AI attribution in the history. Commit trailers such as
  # "Co-Authored-By: Claude" make the tool a listed contributor of the
  # repository, and a generated-with line in a PR body ends up in the
  # merge commit. Both are refused here; main requires this job to pass.
  attribution:
    name: no AI attribution
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages and the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='Co-Authored-By:.*(Claude|Anthropic)|Generated with \[?Claude Code|noreply@anthropic\.com'
          bad=$(git log --format='%h %s%n%b' "$BASE".."$HEAD" | grep -Ei "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "Commit messages carry AI attribution; rewrite them (git rebase / filter-branch) and force-push the branch:"
            echo "$bad"
            exit 1
          fi
          if printf '%s' "$PR_BODY" | grep -Eiq "$pattern"; then
            echo "The pull request description carries AI attribution; remove it."
            exit 1
          fi
          echo "clean"
