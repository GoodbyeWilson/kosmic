# Lint + test on every push and pull request.
#
# One job: Windows with Python 3.12, the only platform KOSMIC supports
# and tests (see the install help). KOSMIC is a Qt desktop app, so the
# suite runs headless via QT_QPA_PLATFORM=offscreen, which the GUI tests
# also set for themselves ('setdefault', so a value set here wins).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The name is the check the 'protect main' ruleset requires.
    name: windows-latest / py3.12
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check kosmic/ main.py tests/

      # Four worker processes, each running whole test files (loadfile),
      # so no file shares a process with more of the suite than before.
      # The two Meta-page GUI files still run in a process of their own:
      # in the same process as the rest of the suite they have failed on
      # Windows (a workspace test, and once a hard crash).
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -q -n 4 --dist loadfile --ignore=tests/test_ma_gene_search.py --ignore=tests/test_meta_workflow_steps.py
          pytest tests/test_ma_gene_search.py tests/test_meta_workflow_steps.py -q
